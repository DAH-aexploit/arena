<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAH Arena — 참가자 로그인</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login" id="form">
    <h1>참가자 페이지</h1>
    <p class="sub">팀 대시보드 토큰으로 로그인합니다.</p>
    <label for="token">Dashboard token</label>
    <input id="token" name="token" autocomplete="off" spellcheck="false" placeholder="팀 토큰">
    <button class="primary" type="submit">로그인</button>
    <div class="err" id="err"></div>
    <div class="hint">
      토큰은 오케스트레이터 기동 로그와 <code>data/credentials.json</code> 에 있습니다.<br>
      <code>make creds</code> 로도 확인할 수 있습니다.
    </div>
  </form>
</div>
<script>
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const token = document.getElementById('token').value.trim();
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    if (res.ok) { location.reload(); return; }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.error || '로그인에 실패했습니다.';
  } catch (_) {
    err.textContent = '서버에 연결할 수 없습니다.';
  }
});
</script>
</body>
</html>
