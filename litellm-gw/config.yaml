litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 600
  callbacks: ["block_hosted_tools.block_hosted_tools_instance"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 30
